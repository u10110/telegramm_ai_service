server {
    listen 80;
    server_name _;

    # фото профилей telegram-аккаунтов из volume
    location /photos/ {
        alias /srv/photos/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin *;
    }

    # API сервиса наружу не торчит — только статика
    location / {
        return 404;
    }
}
