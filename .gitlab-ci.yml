stages:
  - build
  - deploy

#variables:
#  COMPOSE_DOCKER_CLI_BUILD: 1
#  DOCKER_BUILDKIT: 1

# before_script:
#   - docker login -u $NEXUS_REGISTRY_USER -p $NEXUS_REGISTRY_PASSWD registry.mplab.io

build:telegramm_ai_service:
  #allow_failure: true
  stage: build
  image:
    name: docker:stable
    entrypoint: ["/bin/sh", "-c"]
  tags:
    - regru_telegram
  only:
    - main
  variables:
    CONTAINER_IMAGE: registry.mplab.io/telegramm_ai_service:${CI_COMMIT_SHORT_SHA}
    CONTAINER_IMAGE_LATEST: registry.mplab.io/telegramm_ai_service:latest
  script:
    - docker build -f Dockerfile -t ${CONTAINER_IMAGE} .
    - docker tag ${CONTAINER_IMAGE} ${CONTAINER_IMAGE_LATEST}
    - docker push ${CONTAINER_IMAGE_LATEST}
